[package]
name = "alphai-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal stock dashboard: live quotes and charts plus AI-scored financial news and SEC Form 4 insider activity from AlphaAI"
license = "MIT"
repository = "https://github.com/makeev/alphai-tui"
homepage = "https://alphai.io"
readme = "README.md"
keywords = ["tui", "stocks", "finance", "news", "ratatui"]
categories = ["command-line-utilities", "finance"]

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query", "gzip", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
